description: Orapharma is a specialty pharmaceutical company and a division of Bausch
  Health focused on oral healthcare, developing and commercializing products that help
  dental professionals improve and maintain periodontal and oral health. Its portfolio
  includes Arestin (minocycline HCl microspheres for the treatment of periodontitis)
  and the OSSIX bone-grafting and regeneration products. Headquartered in Bridgewater,
  New Jersey, Orapharma partners with dental professionals across the continuum of
  care. Surfaced as a portfolio company of Canaan Partners and added to the API
  Evangelist network; it publishes no public developer API or portal at this time.
