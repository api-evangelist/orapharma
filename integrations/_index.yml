# Orapharma integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in orapharma-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: orapharma-fda-drugs-fda-approved-drug-and-biologic-applications
  label: FDA Drugs@FDA (approved drug and biologic applications)
  partner_name: FDA Drugs@FDA (approved drug and biologic applications)
  category: FDA drug / biologic application holder
  type: contract
  channel: regulator-register
  evidence: https://www.accessdata.fda.gov/scripts/cder/daf/index.cfm?event=overview.process&ApplNo=050781
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Drugs@FDA (openFDA drug/drugsfda; application holder = sponsor_name)
    standard: FDA drug / biologic marketing application (21 CFR 314 / 601)
    spec_file: null
    role: fda-application-holder
    registered_name: ORAPHARMA
    matched_domain: null
    matched_by: register-name
    certified_products:
    - product: New Drug Application (approved) (Drugs@FDA)
      product_type: NDA
      lapsed: false
      products_sample:
      - ARESTIN
    applications_sample:
    - NDA050781
    signal_note: certified_products = one entry per application TYPE (NDA / ANDA / BLA), never per application;
      lapsed when every product under the type is Discontinued. Applications are context, never counted
    detected_by: sweep-clinical-trial-sponsors.py
    detected: '2026-10-21'
    register_name_note: register-name 'orapharma' = orapharma; no wikidata P856
    identity_source: register-name
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
      P856 not contradicting (Kin 2026-10-20 decision 2)
  status: not-a-workflow
  arazzo: null
